name: Release (macOS)

# A v* tag builds Scriptorium.app, zips it and attaches it to a GitHub Release.
# Run by hand (workflow_dispatch) to get the zip as a workflow artifact
# without making a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      universal:
        description: "Also build x86_64 and merge with lipo (default: arm64 only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Bundle Scriptorium.app
        env:
          UNIVERSAL: ${{ inputs.universal && '1' || '0' }}
        run: script/bundle-mac.sh

      - name: Zip
        id: zip
        run: |
          version=$(cargo pkgid -p scriptorium-app | sed 's/.*@//')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }
          fi
          zip="Scriptorium-$version-mac.zip"
          ditto -c -k --keepParent target/bundle/Scriptorium.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" \
            --title "Scriptorium $GITHUB_REF_NAME" \
            --notes "Unsigned (ad-hoc) macOS build, macOS 13+. First launch: right-click Scriptorium.app > Open."
