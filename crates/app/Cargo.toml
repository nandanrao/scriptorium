[package]
name = "scriptorium-app"
description = "The Scriptorium desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scriptorium-app"
path = "src/main.rs"

[dependencies]
scriptorium-core.workspace = true
scriptorium-fdx.workspace = true
scriptorium-review.workspace = true
# The shared shell: atomic writes and the session lock, the same as the CLI
# and MCP server.
scriptorium-fsio = { workspace = true, features = ["opened"] }
# Suggestion numbers by script position, as the CLI and tools show them.
scriptorium-tools.workspace = true
# Pairs of versions: the links file's rows and labels, for the card.
scriptorium-versions.workspace = true
# GPUI: crates.io snapshot gpui-pre (same as gpui-kit).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11", "font-kit"] }
# The chat panel's view model (agent_panel/view_model.rs): threads and stream
# events in, rows out, with the shared chat core's tool-row labels.
scriptorium-agent.workspace = true
scriptorium-chat.workspace = true
# The run driver (agent_panel/driver.rs): transports, keys, accounts; the
# accounts sheet: keys (keyring) and its "Check" request.
scriptorium-providers.workspace = true
serde_json.workspace = true
# Unstyled behaviour layer of gpui-kit (Textarea, TextView markdown, Select,
# Sheet); pins the same gpui-pre. Not gpui-component: we keep theme.rs's look.
gpui-base = "=0.9.1"
unicode-segmentation.workspace = true

# Test tool: a virtual pointer for clicking in headless Sway (see the file).
[[example]]
name = "vpointer"
path = "tests/tools/vpointer.rs"
test = true

[dev-dependencies]
# TestAppContext for the run driver's tests over a live ScriptView.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Already in the tree through gpui's Wayland backend; no new crates.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[lints]
workspace = true
