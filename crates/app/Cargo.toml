[package]
name = "scriptorium-app"
description = "The Scriptorium desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scriptorium-app"
path = "src/main.rs"

[dependencies]
scriptorium-core.workspace = true
scriptorium-fdx.workspace = true
scriptorium-review.workspace = true
# The shared shell: atomic writes, the same as the CLI and MCP server.
scriptorium-cli.workspace = true
# Suggestion numbers by script position, as the CLI and tools show them.
scriptorium-tools.workspace = true
# GPUI: crates.io snapshot gpui-pre (same as gpui-kit).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11", "font-kit"] }
unicode-segmentation.workspace = true

[lints]
workspace = true
