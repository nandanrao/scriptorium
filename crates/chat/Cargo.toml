[package]
name = "scriptorium-chat"
description = "Chat threads for the built-in agent: the panel's pure core (labels, naming, thread list model), plus thread files beside the script, per-thread locks, the clock, the one apply path into a thread's review and the CLI's run loop, behind the shell feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["shell"]
shell = [
    "dep:scriptorium-apps",
    "dep:scriptorium-fsio",
    "dep:scriptorium-providers",
    "dep:scriptorium-tools",
    "dep:scriptorium-review",
    "dep:scriptorium-core",
]

[dependencies]
scriptorium-agent.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
# The shell: the apply path, the file store and the run loop.
# `list_apps` on the files: the apps' folder read (its `shell`, default).
scriptorium-apps = { workspace = true, optional = true, default-features = false, features = ["shell"] }
scriptorium-core = { workspace = true, optional = true }
scriptorium-fsio = { workspace = true, optional = true, features = ["opened"] }
# Without the keyring: the CLI and the app turn it on by depending on providers themselves.
scriptorium-providers = { workspace = true, optional = true, default-features = false, features = ["shell"] }
scriptorium-review = { workspace = true, optional = true }
scriptorium-tools = { workspace = true, optional = true }
# `PairView` (the pair's rows a store hands the tools), and language names
# for the labels (pure, like the core).
scriptorium-versions.workspace = true

[lints]
workspace = true

[dev-dependencies]
scriptorium-fdx.workspace = true
scriptorium-fsio.workspace = true
