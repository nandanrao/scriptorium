[package]
name = "scriptorium-cli"
description = "Headless command line for Scriptorium: inspect, convert and check scripts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "scriptorium_cli"
path = "src/lib.rs"

[[bin]]
name = "scriptorium"
path = "src/main.rs"

[features]
default = ["chat"]
# `chat`, `threads` and `accounts`: the built-in agent, with the OS keyring
# and Ctrl+C handling. Without it the CLI still runs `tool` (the executor's
# shell brings the providers' HTTP, not the keyring).
chat = ["dep:ctrlc", "dep:scriptorium-providers"]

[dependencies]
# Ctrl+C stops a `chat` run through its cancel token.
ctrlc = { workspace = true, optional = true }
scriptorium-agent.workspace = true
# `apps`: the apps list (the folder scan only, not the server).
scriptorium-apps = { workspace = true, default-features = false, features = ["shell"] }
# The tool executor (`tool`): always, also without `chat` (the MCP server).
# Its shell brings the providers' HTTP but not the keyring.
scriptorium-chat.workspace = true
# `connect`: writing agents' settings (step E2).
scriptorium-connect.workspace = true
scriptorium-core.workspace = true
scriptorium-fdx.workspace = true
# `mcp`: the link to the running app.
scriptorium-fsio = { workspace = true, features = ["opened", "link"] }
scriptorium-providers = { workspace = true, optional = true }
scriptorium-review.workspace = true
scriptorium-tools.workspace = true
scriptorium-versions.workspace = true
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "chat"
required-features = ["chat"]

[lints]
workspace = true
