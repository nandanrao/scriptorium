[package]
name = "scriptorium-mcp"
description = "MCP server exposing Scriptorium (through the `scriptorium` CLI library) as tools for Claude (Cowork, Claude Desktop, Claude Code)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriptorium-mcp"
path = "src/main.rs"

[dependencies]
# Without `chat`: the MCP server needs no providers, keyring or HTTP.
scriptorium-cli = { workspace = true, default-features = false }
scriptorium-fsio = { workspace = true, features = ["opened"] }
scriptorium-tools.workspace = true
serde_json.workspace = true

[lints]
workspace = true
