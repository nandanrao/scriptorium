[package]
name = "scriptorium-mcp"
description = "MCP server exposing Scriptorium (through the tool executor the CLI and the app share) as tools for Claude (Cowork, Claude Desktop, Claude Code)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scriptorium-mcp"
path = "src/main.rs"

[dependencies]
scriptorium-agent.workspace = true
# The executor every host runs tools through (its shell brings the
# providers' HTTP, not the keyring).
scriptorium-chat.workspace = true
scriptorium-fsio = { workspace = true, features = ["opened"] }
scriptorium-tools.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests make versions with the CLI's `version new`.
scriptorium-cli = { workspace = true, default-features = false }

[lints]
workspace = true
