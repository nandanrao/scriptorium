<!doctype html>
<html lang="en">
<head>
  <script src="/scriptorium.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters by scene</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 1rem 1.25rem; color: #222; background: #fcfcfa; }
    h1 { font-size: 1.3rem; margin: 0.25rem 0 0.25rem; }
    #status { color: #666; margin: 0 0 1rem; }
    #chart { overflow: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: currentColor; }
    svg .name { font-weight: 600; }
    svg .count { fill: #888; }
    svg .cell { fill: #3b6ea8; }
    svg .empty { fill: #ecebe6; }
    svg .here { fill: #f2c94c; opacity: 0.35; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1d1b; color: #ddd; }
      #status, svg .count { color: #999; fill: #999; }
      svg .empty { fill: #2c2c29; }
      svg .cell { fill: #6d9bd1; }
    }
  </style>
</head>
<body>
  <h1>Characters by scene</h1>
  <p id="status">Reading the script…</p>
  <div id="chart"></div>
  <script src="app.js"></script>
</body>
</html>
