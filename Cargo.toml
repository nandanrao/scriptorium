[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
scriptorium-core = { path = "crates/core" }
scriptorium-fdx = { path = "crates/fdx" }
scriptorium-review = { path = "crates/review" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.10"

[workspace.lints.rust]
unsafe_code = "forbid"
