[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
scriptorium-core = { path = "crates/core" }
scriptorium-fdx = { path = "crates/fdx" }
scriptorium-review = { path = "crates/review" }
scriptorium-agent = { path = "crates/agent" }
scriptorium-tools = { path = "crates/tools" }
scriptorium-cli = { path = "crates/cli" }
scriptorium-fsio = { path = "crates/fsio" }
scriptorium-providers = { path = "crates/providers" }
scriptorium-chat = { path = "crates/chat" }
ctrlc = "3.5"
fs4 = "1"
keyring = { version = "3.6", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order everywhere: GPUI turns it on in the app, and without it in
# the CLI the two order JSON objects differently: tool results (what the
# model reads) and the tool specs behind a thread's tools_hash, so a thread
# moved between the CLI and the app looked like its tools had changed.
serde_json = { version = "1", features = ["preserve_order"] }
unicode-segmentation = "1.10"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
